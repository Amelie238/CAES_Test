<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAES 2026 – Suivi des demandes</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --track: #eef0f3;
    --medical: #2563eb; --shn: #16a34a; --autres: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16191f; --ink: #e8eaed; --muted: #9aa0aa; --line: #2c313a; --track: #262b34;
      --medical: #60a5fa; --shn: #4ade80; --autres: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 14px; }

  .totals { display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 0 0 14px;
    border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .total b { display: block; font-size: 34px; line-height: 1.1; font-weight: 700; }
  .total span { font-size: 13px; color: var(--muted); }

  .modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .module { border-left: 6px solid var(--c); padding: 4px 0 4px 14px; }
  .module h2 { font-size: 16px; margin: 0 0 10px; color: var(--c); font-weight: 650; }
  .row { display: flex; justify-content: space-between; align-items: baseline;
    padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row b { font-size: 20px; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--c); transition: width .3s ease; }
  .rate { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .medical { --c: var(--medical); } .shn { --c: var(--shn); } .autres { --c: var(--autres); }
  .msg { font-size: 13px; color: var(--muted); margin-top: 16px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>CAES 2026 – Suivi des demandes</h1>
  <section class="totals" id="totals"></section>
  <section class="modules" id="modules"></section>
  <p class="msg" id="msg"></p>
</main>

<script>
  var MODULES = [
    { key: 'medical', label: 'CAES médical / handicap' },
    { key: 'shn',     label: 'CAES SHN' },
    { key: 'autres',  label: 'CAES Autres demandes' }
  ];

  function moduleKey(v) {
    var s = String(v || '').toLowerCase();
    if (s.indexOf('médic') > -1 || s.indexOf('medic') > -1 || s.indexOf('handicap') > -1) return 'medical';
    if (s.indexOf('shn') > -1) return 'shn';
    return 'autres';
  }
  function statusKey(v) {
    var s = String(v || '').toLowerCase();
    if (s.indexOf('clôtur') > -1 || s.indexOf('clotur') > -1) return 'closed';
    if (s.indexOf('traiter') > -1) return 'todo';
    if (s.indexOf('trait') > -1) return 'done';
    return null;
  }

  function render(records) {
    var c = { all: { todo: 0, done: 0, closed: 0 } };
    MODULES.forEach(function (m) { c[m.key] = { todo: 0, done: 0, closed: 0 }; });

    records.forEach(function (r) {
      var st = statusKey(r.Statut);
      if (!st) return;
      c[moduleKey(r.Module)][st]++;
      c.all[st]++;
    });

    var total = c.all.todo + c.all.done + c.all.closed;
    document.getElementById('totals').innerHTML =
      '<div class="total"><b>' + total + '</b><span>Demandes au total</span></div>' +
      '<div class="total"><b>' + c.all.todo + '</b><span>À traiter</span></div>' +
      '<div class="total"><b>' + c.all.done + '</b><span>Traitées</span></div>' +
      '<div class="total"><b>' + c.all.closed + '</b><span>Clôturées</span></div>';

    document.getElementById('modules').innerHTML = MODULES.map(function (m) {
      var x = c[m.key], t = x.todo + x.done + x.closed;
      var pct = t ? Math.round(x.closed * 100 / t) : 0;
      return '<article class="module ' + m.key + '"><h2>' + m.label + '</h2>' +
        '<div class="row"><span>À traiter</span><b>' + x.todo + '</b></div>' +
        '<div class="row"><span>Traitées</span><b>' + x.done + '</b></div>' +
        '<div class="row"><span>Clôturées</span><b>' + x.closed + '</b></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="rate">' + pct + ' % clôturées sur ' + t + ' demande' + (t > 1 ? 's' : '') + '</div></article>';
    }).join('');

    document.getElementById('msg').textContent = total === 0
      ? 'Aucune demande à afficher. Vérifiez que les colonnes Module et Statut sont bien associées dans le panneau du widget.'
      : '';
  }

  if (window.grist) {
    grist.ready({
      requiredAccess: 'read table',
      columns: [
        { name: 'Module', title: 'Module', type: 'Choice,Text' },
        { name: 'Statut', title: 'Statut', type: 'Choice,Text' }
      ]
    });
    grist.onRecords(function (records, mappings) {
      var mapped = grist.mapColumnNames(records, mappings);
      render(mapped || []);
    });
  } else {
    // Aperçu hors Grist : données d’exemple
    var demo = [];
    [['Médical / handicap', 'À traiter', 6], ['Médical / handicap', 'Traitée', 4], ['Médical / handicap', 'Clôturée', 9],
     ['SHN', 'À traiter', 3], ['SHN', 'Traitée', 5], ['SHN', 'Clôturée', 12],
     ['Autres demandes', 'À traiter', 2], ['Autres demandes', 'Traitée', 1], ['Autres demandes', 'Clôturée', 7]
    ].forEach(function (d) { for (var i = 0; i < d[2]; i++) demo.push({ Module: d[0], Statut: d[1] }); });
    render(demo);
  }
</script>
</body>
</html>
